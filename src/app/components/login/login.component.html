<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="alert-container" *ngIf="alertMessage">
    <div class="alert shadow-lg border-0 animate slideIn" [ngClass]="alertClass" role="alert">
      {{ alertMessage }}
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <h1 class="display-6 fw-bold text-dark">Mentalize<span class="text-primary">.</span></h1>
        </div>
        
        <app-login-form (registerEvent)="handleRegisterEvent($event)"></app-login-form>
      </div>
    </div>
  </div>
</div>
