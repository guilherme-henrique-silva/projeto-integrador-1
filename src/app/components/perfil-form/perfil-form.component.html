<div class="card shadow-sm border-0 p-4 bg-white rounded-4">
  <h3 class="fw-bold mb-4 text-primary">Meu Perfil</h3>

  <form class="needs-validation" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-semibold">Nome Completo</label>
        <input type="text" class="form-control py-2" formControlName="nome" placeholder="Seu nome completo">
        <div class="text-danger small" *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">Nome é obrigatório</div>
      </div>
      
      <div class="col-md-4">
        <label class="form-label fw-semibold">Telefone</label>
        <input type="text" class="form-control py-2" formControlName="telefone" placeholder="(18) 99999-9999">
      </div>
    </div>

    <div class="row g-3 mt-2">
      <div class="col-md-6">
        <label class="form-label fw-semibold">E-mail (Username)</label>
        <input type="email" class="form-control py-2" formControlName="username" placeholder="nome@exemplo.com">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Senha</label>
        <input type="password" class="form-control py-2" formControlName="password" placeholder="********">
        <div class="form-text">Mínimo 8 caracteres, letras e números.</div>
      </div>
    </div>

    <div class="row g-3 mt-2 align-items-end">
      <div class="col-md-6">
        <label class="form-label d-block fw-semibold">Tipo de Perfil</label>
        <div class="form-check form-check-inline mt-2">
          <input class="form-check-input" type="radio" formControlName="role" id="paciente" value="paciente">
          <label class="form-check-label" for="paciente">Paciente</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="role" id="psicologo" value="psicologo">
          <label class="form-check-label" for="psicologo">Psicólogo</label>
        </div>
      </div>

      <div class="col-md-6" *ngIf="form.get('role')?.value === 'psicologo'">
        <label class="form-label fw-semibold">CRP</label>
        <input type="text" class="form-control py-2" formControlName="crp" placeholder="0000000">
      </div>
    </div>

    <hr class="my-4 opacity-50">

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Endereço</label>
        <input type="text" class="form-control py-2" formControlName="endereco" placeholder="Rua, número, bairro">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Cidade</label>
        <input type="text" class="form-control py-2" formControlName="cidade">
      </div>
      <div class="col-md-1">
        <label class="form-label fw-semibold">UF</label>
        <select class="form-select py-2" formControlName="estado">
          <option *ngFor="let estado of estadosItems" [value]="estado">{{ estado }}</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label fw-semibold">CEP</label>
        <input type="text" class="form-control py-2" formControlName="cep" placeholder="00000000">
      </div>
    </div>

    <div class="d-flex justify-content-between mt-5">
      <button type="button" class="btn btn-outline-danger px-4 py-2 fw-bold" 
              (click)="onDelete()" *ngIf="userId">
        Excluir Conta
      </button>
      
      <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm" [disabled]="form.invalid">
        Salvar Alterações
      </button>
    </div>
  </form>
</div>
