<form [formGroup]="consultaForm" (ngSubmit)="onSubmit()" class="row g-3">
  
  <div class="col-md-12">
    <label class="form-label fw-semibold">Nome do Paciente</label>
    <input 
      type="text" 
      class="form-control" 
      placeholder="Digite o nome completo"
      formControlName="nome"
      [ngClass]="{'is-invalid': consultaForm.get('nome')?.touched && consultaForm.get('nome')?.invalid}">
    <div class="invalid-feedback">O nome é obrigatório (mín. 3 caracteres).</div>
  </div>

  <div class="col-md-6">
    <label class="form-label fw-semibold">Data da Consulta</label>
    <input 
      type="date" 
      class="form-control" 
      formControlName="data"
      [ngClass]="{'is-invalid': consultaForm.get('data')?.touched && consultaForm.get('data')?.invalid}">
    <div class="invalid-feedback">Selecione uma data válida.</div>
  </div>

  <div class="col-md-6">
    <label class="form-label fw-semibold">Horário</label>
    <input 
      type="time" 
      class="form-control" 
      formControlName="hora"
      [ngClass]="{'is-invalid': consultaForm.get('hora')?.touched && consultaForm.get('hora')?.invalid}">
    <div class="invalid-feedback">Informe o horário.</div>
  </div>

  <div class="col-md-12">
    <label class="form-label fw-semibold">Observações</label>
    <textarea 
      class="form-control" 
      rows="3" 
      placeholder="Detalhes adicionais sobre a queixa ou encaminhamento..."
      formControlName="observacoes"></textarea>
  </div>

  <div class="col-12 mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm" [disabled]="isSubmitting">
      @if (isSubmitting) {
        <span class="spinner-border spinner-border-sm me-2"></span>Salvando...
      } @else {
        <i class="bi bi-check-lg me-2"></i>Agendar Consulta
      }
    </button>
  </div>
</form>
