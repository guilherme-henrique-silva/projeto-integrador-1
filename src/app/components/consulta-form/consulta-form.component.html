<form class="needs-validation mt-4 mb-4" novalidate>
  <div class="form-group">
    <label for="inputNomePaciente">Nome do Paciente</label>
    <input class="form-control" type="text" placeholder="Fulano da Silva" aria-label="Nome do paciente" id="inputNomePaciente" required>
    <div class="invalid-feedback">Nome inválido</div>
  </div>
  <div class="form-group">
    <label for="exampleFormControlSelect1">Example select</label>
    <select class="form-control" id="exampleFormControlSelect1">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
    </select>
  </div>
  <div class="form-group">
    <label for="exampleFormControlSelect2">Example multiple select</label>
    <select multiple class="form-control" id="exampleFormControlSelect2">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
    </select>
  </div>
  <div class="form-group">
    <label for="data">Data da consulta:</label>
    <input type="date" id="data" name="data" required>
    <div class="invalid-feedback">Data inválida</div>
  </div>
  <div class="form-group">
    <label for="exampleFormControlTextarea1">Example textarea</label>
    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
  </div>

  <div class="form-group">
    <div class="col-md-2">
        <button type="submit" id="btnSalvarConsulta" class="btn btn-primary">Salvar</button>
    </div>
  </div>
</form>
