<form [formGroup]="consultaForm" (ngSubmit)="onSubmit()" class="row g-3">
  
  <div class="col-md-12">
    <label class="form-label fw-semibold">Selecione o Psicólogo</label>
    <select 
      class="form-select" 
      formControlName="psicologoId"
      [ngClass]="{'is-invalid': consultaForm.get('psicologoId')?.touched && consultaForm.get('psicologoId')?.invalid}">
      <option value="">Escolha um profissional disponível...</option>
      @for (psic of psicologos; track psic.id) {
        <option [value]="psic.id">{{ psic.nome }}</option>
      }
    </select>
    <div class="invalid-feedback">A escolha de um profissional é obrigatória.</div>
  </div>

  <div class="col-md-6">
    <label class="form-label fw-semibold">Data da Consulta</label>
    <input 
      type="date" 
      class="form-control" 
      formControlName="data"
      [ngClass]="{'is-invalid': consultaForm.get('data')?.touched && consultaForm.get('data')?.invalid}">
    <div class="invalid-feedback">Selecione uma data válida.</div>
  </div>

  <div class="col-md-6">
    <label class="form-label fw-semibold">Horário</label>
    <input 
      type="time" 
      class="form-control" 
      formControlName="hora"
      [ngClass]="{'is-invalid': consultaForm.get('hora')?.touched && consultaForm.get('hora')?.invalid}">
    <div class="invalid-feedback">Informe o horário.</div>
  </div>

  <div class="col-md-12">
    <label class="form-label fw-semibold">Observações</label>
    <textarea 
      class="form-control" 
      rows="3" 
      placeholder="Detalhes adicionais sobre a queixa ou motivo da consulta..."
      formControlName="observacoes"></textarea>
  </div>

  <div class="col-12 mt-4 d-flex gap-2">
    <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm" [disabled]="isSubmitting || consultaForm.invalid">
      @if (isSubmitting) {
        <span class="spinner-border spinner-border-sm me-2"></span>Agendando...
      } @else {
        <i class="bi bi-calendar-check me-2"></i>Confirmar Agendamento
      }
    </button>
  </div>
</form>
