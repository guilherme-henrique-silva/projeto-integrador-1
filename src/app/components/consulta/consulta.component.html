<main class="consulta-container py-5 flex-grow-1">
  <div class="container">
    
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        @if(alertMessage) {
          <div class="alert shadow-sm border-2 animate-in mb-4 d-flex align-items-center justify-content-between" 
               [ngClass]="alertClass" role="alert">
            <div class="d-flex align-items-center">
              <i class="bi" [ngClass]="alertClass.includes('success') ? 'bi-check-circle-fill me-2' : 'bi-exclamation-triangle-fill me-2'"></i>
              <span>{{ alertMessage }}</span>
            </div>
            <button type="button" class="btn-close" (click)="alertMessage = null"></button>
          </div>
        }

        <div class="header-section mb-4">
          <h2 class="fw-bold text-dark">
            <i class="bi bi-calendar-plus me-2 text-primary"></i>Agendar Nova Consulta
          </h2>
          <p class="text-muted">Olá, {{ userRole | titlecase }}. Preencha os detalhes da sua sessão abaixo.</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4 mb-4">
          <div class="card-body p-4 p-md-5">
            <app-consulta-form (registerEvent)="handleRegisterEvent($event)"></app-consulta-form>
          </div>
        </div>

        <div class="mt-4">
          <button class="btn btn-link text-decoration-none text-secondary fw-semibold p-0" (click)="voltarHome()">
            <i class="bi bi-arrow-left-circle me-1"></i> Voltar para o Dashboard
          </button>
        </div>
      </div>
    </div>

  </div>
</main>
