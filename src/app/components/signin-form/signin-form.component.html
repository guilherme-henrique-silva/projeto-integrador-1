<div class="card shadow-lg border-0 p-4 bg-white rounded-4">
  <div class="text-center mb-4">
    <h2 class="fw-bold text-primary">Crie sua conta</h2>
    <p class="text-muted">Junte-se à Mentalize e comece seu acompanhamento.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-semibold">Nome Completo</label>
        <input type="text" class="form-control" formControlName="nome" placeholder="Ex: Carlos Dario">
        <div class="text-danger small" *ngIf="isFieldInvalid('nome')">Nome é obrigatório.</div>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Telefone</label>
        <input type="text" class="form-control" formControlName="telefone" placeholder="18999999999">
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-6">
        <label class="form-label fw-semibold">E-mail</label>
        <input type="email" class="form-control" formControlName="username" placeholder="seu@email.com">
        <div class="text-danger small" *ngIf="isFieldInvalid('username')">E-mail inválido.</div>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Senha</label>
        <input type="password" class="form-control" formControlName="password" placeholder="********">
        <div class="form-text small">Mínimo 8 caracteres (A-z e 0-9).</div>
      </div>
    </div>

    <div class="row g-3 mt-1 align-items-center">
      <div class="col-md-6">
        <label class="form-label d-block fw-semibold">Eu sou:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="role" id="roleP" value="paciente">
          <label class="form-check-label" for="roleP">Paciente</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="role" id="rolePs" value="psicologo">
          <label class="form-check-label" for="rolePs">Psicólogo</label>
        </div>
      </div>
      <div class="col-md-6" *ngIf="form.get('role')?.value === 'psicologo'">
        <label class="form-label fw-semibold">CRP</label>
        <input type="text" class="form-control" formControlName="crp" placeholder="0000000">
      </div>
    </div>

    <hr class="my-4">

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Endereço</label>
        <input type="text" class="form-control" formControlName="endereco" placeholder="Rua, Número, Bairro">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Cidade</label>
        <input type="text" class="form-control" formControlName="cidade">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Estado</label>
        <select class="form-select" formControlName="estado">
          <option *ngFor="let uf of estadosItems" [value]="uf">{{ uf }}</option>
        </select>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label fw-semibold">CEP</label>
        <input type="text" class="form-control" formControlName="cep" placeholder="00000000">
      </div>
    </div>

    <div class="mt-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" formControlName="termos" id="checkTermos">
        <label class="form-check-label small" for="checkTermos">
          Li e concordo com os termos de uso.
        </label>
      </div>
    </div>

    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-primary btn-lg fw-bold" [disabled]="form.invalid">
        Finalizar Cadastro
      </button>
    </div>
  </form>
</div>
