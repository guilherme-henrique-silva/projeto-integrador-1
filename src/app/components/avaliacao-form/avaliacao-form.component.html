<form [formGroup]="formAvaliacao" (ngSubmit)="onSubmit()" class="card border-0 p-3 shadow-sm rounded-4 bg-light">
  <label class="form-label fw-bold text-dark mb-3">Como você avalia seu bem-estar hoje?</label>
  
  <div class="d-flex flex-wrap gap-2 justify-content-between">
    @for (nivel of niveis; track nivel) {
      <div class="form-check p-0 m-0">
        <input 
          type="radio" 
          class="btn-check" 
          [id]="'radio' + nivel" 
          [value]="nivel" 
          formControlName="nota">
        <label 
          class="btn btn-outline-primary rounded-circle d-flex align-items-center justify-content-center" 
          [for]="'radio' + nivel"
          style="width: 42px; height: 42px;">
          {{ nivel }}
        </label>
      </div>
    }
  </div>

  <div class="mt-4 d-grid">
    <button type="submit" class="btn btn-primary rounded-pill shadow-sm" [disabled]="formAvaliacao.invalid">
      Confirmar Avaliação
    </button>
  </div>
</form>
