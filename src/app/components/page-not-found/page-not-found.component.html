<div class="error-container d-flex align-items-center justify-content-center">
  <div class="text-center animate-in">
    <div class="icon-box mb-4">
      <i class="bi bi-search-heart display-1 text-primary opacity-50"></i>
      <span class="badge-404">404</span>
    </div>

    <h1 class="fw-bold text-dark display-5">Página não encontrada</h1>
    <p class="text-muted fs-5 mb-5 px-4">
      Ops! Parece que esse caminho não existe no Mentalize.<br>
      Nem com visão de raio-X conseguimos encontrar o que você procurava.
    </p>

    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
      <button routerLink="/home" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm fw-bold">
        <i class="bi bi-house-door me-2"></i>Voltar ao Início
      </button>
      <button (click)="goBack()" class="btn btn-outline-secondary btn-lg rounded-pill px-5 fw-bold">
        <i class="bi bi-arrow-left me-2"></i>Página Anterior
      </button>
    </div>
  </div>
</div>
